strong\u003EShift Timings: 11 AM to 8 PM or 2PM to 11PM\u003C\/strong\u003E\u003C\/p\u003E \u003Cp\u003E\u003Cstrong\u003EQualifications\u003C\/strong\u003E\u003C\/p\u003E \u003Cp\u003ERequired:\u003C\/p\u003E \u003Cul\u003E \u003Cli\u003EBachelor\u2019s degree in any discipline\u003C\/li\u003E \u003Cli\u003E1-3 years of experience developing and editing learning media, including user interface and user experience design, website design, e-learning courses, motion graphics, infographics, print design, and audio editing\u003C\/li\u003E \u003Cli\u003EExperience using Microsoft Office, including Microsoft Word and PowerPoint\u003C\/li\u003E \u003Cli\u003EExperience using Adobe Animate, Adobe Photoshop, Adobe After Effects, Adobe Illustrator, Adobe InDesign, Adobe Premiere, and audio editing software\u003C\/li\u003E \u003Cli\u003EExperience creating freehand and digital illustrations\u003C\/li\u003E \u003Cli\u003EExperience developing storyboards, design concepts, and final deliverables based on client briefs\u003C\/li\u003E \u003Cli\u003EExperience working with stakeholders across geographies to gather requirements and clarify scope\u003C\/li\u003E \u003C\/ul\u003E \u003Cp\u003EPreferred:\u003C\/p\u003E \u003Cul\u003E \u003Cli\u003EBachelor of Fine Arts, Bachelor of Design, or diploma in graphic design or web design\u003C\/li\u003E \u003Cli\u003EExperience conducting knowledge transfer sessions or mentoring junior team members\u003C\/li\u003E \u003Cli\u003EExperience applying current graphic design trends in corporate or learning environments\u003C\/li\u003E \u003Cli\u003EExperience managing multiple design assignments and meeting deadlines during peak periods\u003C\/li\u003E \u003Cli\u003EExperience identifying project risks, coordinating issue resolution, and escalating issues when needed\u003C\/li\u003E \u003Cli\u003EPortfolio demonstrating visualization skills for learning solutions and graphic elements\u003C\/li\u003E\u003C\/ul\u003E\u003C\/div\u003E",
