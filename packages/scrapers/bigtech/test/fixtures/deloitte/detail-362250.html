            "description": "\u003Cdiv\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 10pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003C\/div\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cp style=\"margin-bottom: 0in;\"\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 10pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003C\/div\u003E\u003C\/div\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003Cbr\u003E\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDo you have a passion to support Deloitte Tax in helping global clients transform their Global Trade solution? Are you a team player with a practical, business-oriented mindset? Do you enjoy working in an ever-changing global environment with fast-moving markets and evolving business models? If the answer to all the above is \u201cYes,\u201d come join us in the International Tax group.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWe are a recognized leader in solving some of the complex business problems for our clients, differentiated by our ability to execute on the insights we provide. Our multi-disciplinary competencies allow us to address CXO issues from several angles.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDeloitte Tax Services India Private Limited (\u201cUSI Tax\u201d) commenced operations in June 2004. Since then, nearly all of the Deloitte Tax LLP (\u201cDeloitte Tax\u201d) U.S. service lines have obtained support through USI Tax practice. USI Tax offers you opportunities to learn U.S. taxation, a sought-after career option.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDeloitte Tax is leading clients through the tax transformation taking place in the marketplace by offering a broad range of fully integrated tax services and add greater impact to their clients by combining technology and tax technical resources to uncover insights and for navigating an increasingly complex global environment.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWork You'll Do - Intro: Our team specializes in effective technology-enabled methodologies and providing leading practices for global trade programs that address both international and local requirements, as well as embed international trade controls into day-to-day business operations.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWork You'll Do -:\u003C\/span\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cul\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPerform assessments of existing information systems, and identify gaps between business requirements and\/or current process\/system capabilities during workshop sessions with business users\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWorking with clients to assess and deploy technology solutions to enable international trade management operations.\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPlanning and compliance assistance, and exploration of automated import and export solutions.\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDevelop customized solutions and draft functional design documentation utilizing strong skills in logical thinking, decision making, problem solving, and attention to detail.\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ESupport new business processes around global trade and other areas such as supply chain and other key functions\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDeliver &amp; provide implementation support for complex projects in a fast-paced, eam environment\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPromote and participate in forums for sharing expertise, strengthening Deloitte's collective knowledge, and helping resolve our clients' challenges\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EYou will contribute to the development and growth of the SAP GTS practice globally.\u003C\/span\u003E\u003C\/li\u003E\u003C\/ul\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EThe Team:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EThe GTA practice is composed of operations specialists, Global Trade Management technology specialists, customs brokers, auditors, and trade management professionals who help importers and exporters achieve worldwide compliance and realize efficiencies and advantages in their global supply chain. You will be based in India and support Deloitte Tax to serve clients with international operations and supports their global trade compliance requirements.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ELocation:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E&nbsp;Mumbai, Hyderabad, Gurugram, Bengaluru, Chennai, Kolkata, Pune\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EShift Timings:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E&nbsp;11 AM to 8 PM\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EQualifications - Required:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003Cul\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EMinimum 8 years relevant SAP consulting or industry experience\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EBachelor \/ Master degree in relation to Engineering, Information Systems, Computer Science, Business or similar \u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPrior implementation or support work experience with SAP GTS\u003C\/span\u003E\u003C\             "experienceRequirements": "\u003Cdiv\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 10pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003C\/div\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cp style=\"margin-bottom: 0in;\"\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 10pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003C\/div\u003E\u003C\/div\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cdiv style=\"display: inline;\"\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003Cbr\u003E\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDo you have a passion to support Deloitte Tax in helping global clients transform their Global Trade solution? Are you a team player with a practical, business-oriented mindset? Do you enjoy working in an ever-changing global environment with fast-moving markets and evolving business models? If the answer to all the above is \u201cYes,\u201d come join us in the International Tax group.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWe are a recognized leader in solving some of the complex business problems for our clients, differentiated by our ability to execute on the insights we provide. Our multi-disciplinary competencies allow us to address CXO issues from several angles.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDeloitte Tax Services India Private Limited (\u201cUSI Tax\u201d) commenced operations in June 2004. Since then, nearly all of the Deloitte Tax LLP (\u201cDeloitte Tax\u201d) U.S. service lines have obtained support through USI Tax practice. USI Tax offers you opportunities to learn U.S. taxation, a sought-after career option.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDeloitte Tax is leading clients through the tax transformation taking place in the marketplace by offering a broad range of fully integrated tax services and add greater impact to their clients by combining technology and tax technical resources to uncover insights and for navigating an increasingly complex global environment.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWork You'll Do - Intro: Our team specializes in effective technology-enabled methodologies and providing leading practices for global trade programs that address both international and local requirements, as well as embed international trade controls into day-to-day business operations.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWork You'll Do -:\u003C\/span\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cul\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPerform assessments of existing information systems, and identify gaps between business requirements and\/or current process\/system capabilities during workshop sessions with business users\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EWorking with clients to assess and deploy technology solutions to enable international trade management operations.\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPlanning and compliance assistance, and exploration o rt and export solutions.\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDevelop customized solutions and draft functional design documentation utilizing strong skills in logical thinking, decision making, problem solving, and attention to detail.\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ESupport new business processes around global trade and other areas such as supply chain and other key functions\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDeliver &amp; provide implementation support for complex projects in a fast-paced, eam environment\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPromote and participate in forums for sharing expertise, strengthening Deloitte's collective knowledge, and helping resolve our clients' challenges\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EYou will contribute to the development and growth of the SAP GTS practice globally.\u003C\/span\u003E\u003C\/li\u003E\u003C\/ul\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EThe Team:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EThe GTA practice is composed of operations specialists, Global Trade Management technology specialists, customs brokers, auditors, and trade management professionals who help importers and exporters achieve worldwide compliance and realize efficiencies and advantages in their global supply chain. You will be based in India and support Deloitte Tax to serve clients with international operations and supports their global trade compliance requirements.\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ELocation:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E&nbsp;Mumbai, Hyderabad, Gurugram, Bengaluru, Chennai, Kolkata, Pune\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EShift Timings:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E&nbsp;11 AM to 8 PM\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EQualifications - Required:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003Cul\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EMinimum 8 years relevant SAP consulting or industry experience\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EBachelor \/ Master degree in relation to Engineering, Information Systems, Computer Science, Business or similar \u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EPrior implementation or support work experience with SAP GTS\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ETechnology interest, problem solving, awareness of cutting-edge solutions \u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EStrong written and verbal communication in English \u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EOperational\/process design awareness, executive presence, strong analytical and critical thinking skills with the ability to solve complex problems and easily communicate findings\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ETechnical or functional lead on at least 2 full-lifecycle SAP implementation\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EAbility to travel up to 0-10%, on average, based on the work you do and the clients and industries\/sectors you serve\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EExperience implementing one or more of the following SAP GTS Modules: Compliance Management, Customs Management or Trade Preference\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EExperience with one or more SAP ECC or S\/4 modules: SD, MM, LE\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ESAP SD\/MM, S4HANA or similar certifications required\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EAbility to perform job responsibilities within a hybrid work model that requires professionals to co-locate in person 2-3 days per week\u003C\/span\u003E\u003C\/li\u003E\u003C\/ul\u003E\u003Cp\u003E\u003Cstrong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EQualifications - Preferred:\u003C\/span\u003E\u003C\/strong\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003Cbr\u003E Preferred:\u003C\/span\u003E\u003C\/p\u003E\u003Cul\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EEducation with SAP focus (any of the following): S\/4 or ECC Sales and Distribution, Order to Cash, Procure to Pay, Material Master, Transportation Management\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003ESoftware aptitude in PowerPoint, MS Project, Visio, Excel, and\/or bug tracking solutions (i.e. JIRA, Azure DevOps, etc.)\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EDemonstrated interest &amp; experience in international trade or international business\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EStrong research, writing, verbal communication, and project management skills\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EExperience presenting to clients or other decision makers\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EAbility to work both independently and as part of a team with professionals at all levels\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EKnowledge of export regulations including ITAR\/EAR\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EAbility to work with ambiguity\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EAbility to bring 'out of the box' solution design that is aligned to leading practices and differentiated business outcome\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EUnderstanding of end-to-end processes and attention to detailed design.\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EStrong team and organizational skills, ability to self-manage time and tasks\u003C\/span\u003E\u003C\/li\u003E\u003Cli\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003EAbility to manage client and cross functional team expectations\u003C\/span\u003E\u003C\/li\u003E\u003C\/ul\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E#TAXGTS\u003C\/span\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cspan style=\"line-height: 115%; font-family: Calibri, sans-serif; font-size: 11pt;\"\u003E\u003C\/span\u003E\u003C\/p\u003E\u003C\/div\u003E\u003C\/div\u003E\u003Cdiv\u003E\u003C\/div\u003E",
