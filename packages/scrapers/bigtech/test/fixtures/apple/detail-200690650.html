<script nonce="x">window.__staticRouterHydrationData = JSON.parse("{\"loaderData\": {\"root\": {\"appType\": \"external\", \"locale\": \"en-in\"}, \"jobDetails\": {\"jobsData\": {\"id\": \"PIPE-200690650\", \"type\": \"PIPE\", \"managedPipelineRole\": false, \"reqId\": \"PIPE-200690650\", \"jobNumber\": \"200690650-0321\", \"postingTitle\": \"Senior UI Engineer - Web\", \"transformedPostingTitle\": \"senior-ui-engineer-web\", \"jobSummary\": \"Do you want to help build some of the largest and most consequential enterprise and customer technology systems in the world? Join Apple\\u2019s Information Systems and Technology (IS&T) organization.  IS&T is the engine behind everything Apple does for customers and for the people who build for them. It\\u2019s Apple\\u2019s central nervous system. Supporting 2.5 billion active Apple devices, processing billions of secure transactions, and keeping the technology that defines modern life running flawlessly, IS&T makes the impossible feel effortless.Do you love building solutions to handle global complexity and immense scale? Imagine what you could do here\\n\\nRetail and Marcom Engineering, an IS&T team, builds and operates the systems and experiences that connect Apple's products with its customers. The team owns the technology behind both Apple's online and physical stores and drives the interactive marketing experiences and tools that keep creative operations moving. Together, those functions deliver the technology behind every product story Apple tells and every purchase a customer makes.\", \"description\": \"We are seeking for Senior UI Engineer who is passionate about crafting visually stunning web applications that embody the highest standards of design, usability, and engineering excellence.\\n\\nThe role calls for an engineer deeply committed to building high-performance, accessible, scalable, and innovative web experiences that continually delight and inspire customers around the world. With a strong eye for pixel-perfect detail and a passion for exceptional user experience, you will turn requirements, user journeys, and wireframes into intuitive, production-ready applications.\\n\\nYou will work closely with UX designers, product managers, and backend engineers to transform ideas into elegant and reliable web experiences. The ideal candidate combines strong front-end engineering fundamentals with creative problem-solving, ownership, and a continuous desire to raise the bar on quality.\\n\\nYou will also have opportunities to leverage Generative AI and AI-assisted development to accelerate engineering workflows, rapidly prototype ideas, improve productivity, and build innovative AI-powered user experiences.\", \"responsibilities\": \"Application Architecture & UI Craft: Architect, build, and maintain scalable, high-performance web applications using modern JavaScript/TypeScript and frameworks (React, Angular, or Vue), transforming wireframes and designs into pixel-perfect, responsive user experiences.\\n\\nDesign Systems & Token Architecture: Design and scale reusable component libraries and enterprise design token systems (typography, color, spacing, theming) to drive visual consistency and development velocity across large applications.\\n\\nPerformance & Core Web Vitals: Proactively measure, monitor, and enforce production performance budgets\\u2014optimizing Core Web Vitals (LCP, CLS, INP), rendering pipelines, bundle sizes, lazy loading, and asset caching.\\n* Accessibility & Inclusive Design: Champion WCAG accessibility standards and inclusive design best practices, ensuring cross-browser compatibility and seamless usability across all devices.\\n\\nData Layer & API Integration: Connect front-end clients with RESTful and GraphQL backend services, efficiently managing asynchronous state, data streaming, and large, complex datasets.\\n\\nEngineering Rigor & Quality: Write comprehensive automated tests (unit, integration, and E2E), lead constructive code and design reviews, and actively improve developer tooling, automation, and CI/CD workflows.\\n\\nAI-Assisted Developer Productivity: Leverage Generative AI tools to accelerate prototyping, coding, testing, and debugging workflows, applying rigorous engineering judgment to validate AI-generated code for security, privacy, and correctness.\\n\\nAI-Powered Product Experiences: Integrate applications with LLM APIs, services, and agentic workflows to build innovative, contextual user experiences (e.g., conversational interfaces, semantic search, and intelligent recommendations).\\n\\nCross-Functional Collaboration & Ownership: Partner closely with UX designers, product managers, and backend engineers to influence technical solutions and deliver end-to-end features with high autonomy.\", \"highJobTitle\": \"Software Engineering Applications ICT3\", \"teamNames\": [\"Software and Services\"], \"locations\": [{\"id\": \"postLocation-BGS\", \"name\": \"Bengaluru\", \"city\": \"Bengaluru\", \"code\": \"BGS\", \"stateProvince\": \"Karnataka\", \"countryName\": \"India\", \"countryID\": \"iso-country-IND\", \"level\": 5}, {\"id\": \"postLocation-HY1\", \"name\": \"Hyderabad\", \"city\": \"Hyderabad\", \"code\": \"HY1\", \"stateProvince\": \"Telangana\", \"countryName\": \"India\", \"countryID\": \"iso-country-IND\", \"level\": 5}], \"localeInfo\": {\"languageCode\": \"en_UK\", \"dateFormat\": \"MMM D, YYYY\", \"defaultLocaleCode\": \"en-GB\", \"locale\": \"en-in\", \"data\": \"en_UK\", \"translation\": \"en-GB\"}, \"postDateInGMT\": \"2026-10-21T09:14:53.138+00:00\", \"postingPostLocationData\": {\"en_US\": {\"postLocation-BGS\": {\"localeLanguage\": {\"en_US\": \"English - US\"}, \"postingDate\": \"2026-10-21T09:14:53.138+00:00\"}, \"postLocation-HY1\": {\"localeLanguage\": {\"en_US\": \"English - US\"}, \"postingDate\": \"2026-10-21T09:14:53.138+00:00\"}}}, \"longPostingDate\": \"2026-10-21T09:14:53.138+00:00\", \"postingDateMeta\": \"2026-10-21\", \"usaIndicator\": false, \"uaeIndicator\": fa
