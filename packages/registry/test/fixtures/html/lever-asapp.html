/* Stamp a confirmed close ONLY on trusted user clicks. Works globally via delegation. */
(function(){
 var TS_KEY = 'ttg_popup_closed_ts';
 var OK_KEY = 'ttg_popup_closed_confirmed';
 var CLOSE_SEL = '.close-modal, .close-embed, .close-modal svg';
 function stamp(){
 var ts = String(Date.now());
 try {
 localStorage.setItem(TS_KEY, ts);
 localStorage.setItem(OK_KEY, '1'); // gate so head script only runs after a real user close
 } catch(e){}
 }
 // delegate so late-mounted elements are handled
 document.addEventListener('click', function(e){
 // Only count real user clicks, not programmatic ones
 if (e.isTrusted && e.target && e.target.closest && e.target.closest(CLOSE_SEL)) {
 stamp();
 }
 }, {capture:true, passive:true});
})();

function filterJobs() {

 var jobCategory = job.getAttribute('data-category');
 var locMatch = location === '' || location === jobLoc;
 var categoryMatch = category === '' || category === jobCategory;
 job.style.display = locMatch && categoryMatch ? 'flex' : 'none';
 });
}
function setLocationOptions(locations) {
 var field = document.querySelector('#field');
 field.innerHTML = '<option value="">All Locations</option>';
 locations.forEach(function (location) {
 var option = document.createElement('option');
 option.value = location;
 option.textContent = location;
 field.appendChild(option);
 });
 field.addEventListener('change', filterJobs);
}
function setCategoryOptions(categories) {
 var field = document.querySelector('#category-field');
 field.innerHTML = '<option value="">All Categories</option>';
 categories.forEach(function (category) {
 var option = document.createElement('option');
 option.value = category;
 option.textContent = category;
 field.appendChild(option);
 });
 field.addEventListener('change', filterJobs);
}
function renderJobs(jobs) {

 row.remove();
 });

 categories.push(job.categories.department);

 link.href = applyUrl;

 link.rel = 'noopener';

 jobsList.insertBefore(link, staticLink);

 }
